[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triaje"
version = "0.1.0"
description = "Triaje clínico de mensajes de pacientes con LoRA/DoRA sobre Qwen2.5-0.5B-Instruct (Hackatón 8, UTEC)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Equipo Las Grills" }]

# Mismos mínimos que requirements.txt (las versiones probadas en Colab). Aquí
# solo se declaran para que `pip install -e .` funcione también en local.
dependencies = [
    "transformers>=5.20",
    "peft>=0.21",
    "accelerate>=1.15",
    "datasets>=4.8",
    "numpy>=2.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.6",
    "scipy>=1.16",
    "statsmodels>=0.15",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Solo si se vuelve a cargar el modelo en 4-bit (Config.use_4bit=True); con
# Qwen2.5-0.5B en fp16 no hace falta.
qlora = ["bitsandbytes>=0.45"]

[tool.setuptools.packages.find]
where = ["src"]
